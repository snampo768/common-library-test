name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    uses: snampo768/build_tools_workflows/.github/workflows/codeql-common.yml@main
    with:
      repo_type: rdkb
      container_image: ghcr.io/rdkcentral/docker-rdk-ci:latest
